services:
  web:
    container_name: espace-image
    build: .
    image: espace-image:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-America/Montreal}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEBAPP_DEBUG=${WEBAPP_DEBUG:-false}
      - CALDAV_URL=${CALDAV_URL:-}
      - CALDAV_USERNAME=${CALDAV_USERNAME:-}
      - CALDAV_PASSWORD=${CALDAV_PASSWORD:-}
      - CALDAV_PROVIDER=${CALDAV_PROVIDER:-}
      - CALDAV_CALENDAR=${CALDAV_CALENDAR:-}
      - CALDAV_SYNC_ENABLED=${CALDAV_SYNC_ENABLED:-true}
      - CALDAV_DISABLE_HTTP3=${CALDAV_DISABLE_HTTP3:-false}
      - CALDAV_CONNECT_TIMEOUT_SECONDS=${CALDAV_CONNECT_TIMEOUT_SECONDS:-20}
      - CALDAV_READ_TIMEOUT_SECONDS=${CALDAV_READ_TIMEOUT_SECONDS:-60}
      - CALDAV_MAX_RETRIES=${CALDAV_MAX_RETRIES:-5}
      - CALDAV_VERIFY_SSL=${CALDAV_VERIFY_SSL:-true}
      - BACKGROUND_SYNC_DELAY_MINUTES=${BACKGROUND_SYNC_DELAY_MINUTES:-0}
      - BACKGROUND_SYNC_DEFAULT_MINUTES=${BACKGROUND_SYNC_DEFAULT_MINUTES:-120}
