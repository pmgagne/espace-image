description="Implements a specific phase from the PLAN.md."
prompt = """
Okay, let's implement **{{args}}** from the plan.

1.  **Context**: Read `PLAN.md` to identify the specific tasks for this phase.
2.  **Action**: Perform the necessary code changes (creating tools, updating prompts, etc.) as specified.
3.  **Tests**: Test the modifications to ensure they work as expected.
