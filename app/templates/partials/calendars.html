<div>
    <h2>Calendar Sources</h2>
    
    <div style="margin-bottom: 30px;">
        <form hx-post="/admin/calendars" hx-target="#admin-content" style="background: #222; padding: 20px; border-radius: 8px;">
            <h3>Add New Calendar</h3>
            <div style="display: grid; grid-template-columns: 1fr 2fr 100px auto; gap: 10px; align-items: end;">
                <div>
                    <label>Label</label>
                    <input type="text" name="label" placeholder="e.g. Work" required style="margin-bottom:0;">
                </div>
                <div>
                    <label>URL (WebCal/ICS)</label>
                    <input type="text" name="url" placeholder="https://..." required style="margin-bottom:0;">
                </div>
                <div>
                    <label>Color</label>
                    <input type="color" name="color" value="#3182ce" style="width: 100%; height: 38px; padding: 0; border: none; background: none;">
                </div>
                <button type="submit">Add</button>
            </div>
        </form>
    </div>

    <h3>Active Calendars</h3>
    
    {% if not sources %}
        <p style="color: #666; font-style: italic;">No calendars configured.</p>
    {% else %}
        <div style="display: flex; flex-direction: column; gap: 10px;">
            {% for source in sources %}
            <div style="background: #222; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid {{ source.color }};">
                <div>
                    <strong>{{ source.label }}</strong>
                    <div style="font-size: 0.8em; color: #888; max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        {{ source.url }}
                    </div>
                </div>
                
                <button class="delete-btn" 
                        hx-delete="/admin/calendars/{{ source.id }}" 
                        hx-target="#admin-content"
                        hx-confirm="Are you sure you want to remove this calendar?">
                    Remove
                </button>
            </div>
            {% endfor %}
        </div>
    {% endif %}
</div>
