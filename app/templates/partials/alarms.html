{% if alarms %}
<div id="alarm-box" class="alarm-box-container">
    {% for alarm in alarms %}
    <div class="alarm-item" data-entry-type="{{ alarm.entry_type }}">
        <div class="alarm-header">
            <span class="alarm-icon">
                {% if alarm.entry_type == 'alarm' %}⏰{% elif alarm.entry_type == 'event' %}📅{% else %}🧪{% endif %}
            </span>
            <span class="alarm-title">{{ alarm.name or alarm.fallback_text or 'No time available' }}</span>
        </div>
        <div class="alarm-body">
            <span class="alarm-time alarm-time-small" data-start="{{ alarm.start_iso }}" data-end="{{ alarm.end_iso }}"
                data-allday="{{ alarm.all_day }}"></span>
        </div>
        <button type="button" class="dismiss-btn-small" aria-label="Dismiss alarm"
            data-api-dismiss-alarm-id="{{ alarm.uid }}" data-api-dismiss-mock="{{ 'true' if alarm.mock else 'false' }}"
            data-api-dismiss-tz-offset="{{ alarm.tz_offset if alarm.tz_offset is not none else '' }}">
            Dismiss
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
