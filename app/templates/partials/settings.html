<div>
    <h1>General Settings</h1>
    <p class="text-muted-light text-sm mb-10">Backend timezone: <strong>{{ backend_timezone
            }}</strong> — Browser timezone: <strong id="browser-tz">Detecting…</strong></p>

    <form id="admin-settings-form">
        <h2>Weather Configuration</h2>
        <p class="text-muted text-sm mb-15">
            Powered by Open-Meteo. Requires Latitude and Longitude.
            {% if location_name %}
            <br><span class="text-success">Detected: <strong>{{ location_name }}</strong></span>
            {% endif %}
        </p>

        <!-- Location Search -->
        <div class="d-flex flex-gap-10 mb-15">
            <label for="location_query" class="d-none">Location Search</label>
            <input type="text" name="location_query" id="location_query" placeholder="Enter City Name (e.g. Montreal)"
                class="flex-1 mb-0">
            <button id="btn-search" type="button" hx-post="/admin/settings/search" hx-target="#admin-content"
                hx-include="[name='location_query']" class="bg-info">
                Search
            </button>
        </div>

        <div class="d-flex flex-gap-20">
            <div class="flex-1">
                <label for="lat">Latitude</label>
                <input type="number" step="any" name="latitude" id="lat" value="{{ settings.weather_latitude or '' }}">
            </div>
            <div class="flex-1">
                <label for="lon">Longitude</label>
                <input type="number" step="any" name="longitude" id="lon"
                    value="{{ settings.weather_longitude or '' }}">
            </div>
        </div>

        <button type="button" id="btn-gps" class="bg-dark-tertiary mb-20 mt-10">
            📍 Use Browser GPS
        </button>

        <h2>Slideshow Configuration</h2>
        <div class="d-flex flex-gap-20">
            <div class="flex-1">
                <label for="active_preset_id">Active Preset</label>
                <select name="active_preset_id" id="active_preset_id">
                    <option value="">-- No Preset Selected --</option>
                    {% for preset in presets %}
                    <option value="{{ preset.id }}" {% if settings.active_preset_id==preset.id %}selected{% endif %}>
                        {{ preset.name }} ({{ preset.photo_count }} photos)
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex-1">
                <label for="duration">Duration (seconds)</label>
                <input type="number" name="duration" id="duration" value="{{ settings.slideshow_duration or 30 }}"
                    min="5">
            </div>
        </div>

        <div class="mt-20 border-top pt-20">
            <button type="submit">Save Changes</button>
            <span class="htmx-indicator ml-10 text-muted">Saving...</span>
        </div>
    </form>
    <!-- Calendar defaults moved to Calendars page; per-calendar toggles handled there -->
</div>
