{% extends "base.html" %}

{% block head %}
<style>
    /*
     * Legacy "Passive Display" Layout (iPad 2 / iOS 9)
     * No Flexbox centering in full-screen if problematic, no Backdrop Filter.
     */

    body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: Helvetica, Arial, sans-serif;
        overflow: hidden;
    }



    /* --- Layer 1: Slideshow --- */
    .slideshow-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: #000;
    }

    /* Small timestamp used for alarm items */
    .alarm-time-small {
        font-size: 16px;
        color: #ccc;
        display: block;
        margin-top: 2px;
        font-weight: 400;
        letter-spacing: 0.5px;
    }

    .slide-container {
        width: 100%;
        height: 100%;
        opacity: 1;
        -webkit-transition: opacity 0.8s ease-in-out;
        transition: opacity 0.8s ease-in-out;
    }

    .slide-container.fade-out {
        opacity: 0;
    }

    .full-slide {
        width: 100%;
        height: 100%;
        /* object-fit: cover is supported in iOS 9.3+ but fallbacks are safer if needed */
        object-fit: cover;
        display: block;
    }

    /* --- Layer 2: Info Box --- */
    /* Center-Top Floating Box */
    .info-box-container {
        position: absolute;
        top: 20px;
        left: 50%;
        /* Translate trick works on iOS 9 */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 10;

        width: 450px;
        text-align: center;

        /* Fallback: Solid semi-transparent background (No blur) */
        background: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 20px;

        color: #fff;
    }

    #clock {
        font-size: 100px;
        font-weight: 100;
        margin-bottom: 10px;
        line-height: 1;
    }

    #date-display {
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
        color: #ddd;
    }

    /* Weather Component */
    .weather-info {
        border-top: 1px solid #555;
        padding-top: 12px;
        font-size: 24px;
        /* Using floats or inline-block for side-by-side if flex acts up,
           but iOS 9 supports display:flex enough for simple rows */
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
    }

    .weather-info .temp {
        margin-right: 15px;
        font-weight: bold;
    }

    .weather-info .condition {
        opacity: 0.8;
    }

    /* --- Layer 3: Persistent Alarm Box (Legacy) --- */
    .alarm-box-container {
        position: absolute;
        bottom: 60px;
        /* Above Admin link */
        left: 50%;
        /* iOS 9 supports transform */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 20;

        width: 450px;
        text-align: center;

        /* Solid background for legacy */
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 20px;
        border: 1px solid #555;

        color: #fff;
        box-sizing: border-box;
        /* Limit height and allow scrolling when multiple alarms appear */
        max-height: 40vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .alarm-item {
        padding-bottom: 15px;
        margin-bottom: 15px;
        border-bottom: 1px solid #555;
    }

    .alarm-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }

    .alarm-header {
        font-size: 24px;
        color: #fff;
        /* Brighter red for dark bg */
        font-weight: bold;
        margin-bottom: 5px;
    }

    .alarm-body {
        font-size: 18px;
        color: #fff;
        margin-bottom: 10px;
    }

    .dismiss-btn-small {
        background: #222;
        color: #aaa;
        border: 1px solid #555;
        padding: 8px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        -webkit-appearance: none;
        /* iOS Reset */
    }

    /* Simple Fade */
    .slide-container {
        -webkit-transition: opacity 1s;
        transition: opacity 1s;
    }

    .htmx-swapping>.slide-container {
        opacity: 0;
    }

    .admin-link {
        position: absolute;
        bottom: 15px;
        right: 15px;
        z-index: 50;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 16px;
        border: 1px solid #444;
    }
</style>

<link rel="manifest" href="/static/legacy-manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/espaceimage-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/espaceimage-512.png">
<link rel="icon" href="/static/espaceimage-512.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/espaceimage-192.png">
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/static/sw.js');
        });
    }
</script>

{% endblock %}

{% block content %}
<!-- Admin Access -->
<a href="/admin" class="admin-link">Admin</a>

<!-- Slideshow -->
<div id="slide-wrapper" class="slideshow-container">
    <div style="background: #222; width: 100%; height: 100%;"></div>
</div>

<!-- Info Box -->
<div class="info-box-container">
    <div id="clock">00:00</div>
    <div id="date-display">...</div>

    <div id="weather-wrapper">
        Loading Weather...
    </div>

    <div id="last-sync" data-utc="{{ last_sync_utc or '' }}">{{ last_sync_utc or '' }}</div>
</div>

<!-- Alarm Container -->
<div id="alarm-wrapper"></div>

<script>
    // --- legacy_engine.js (ES5 for iOS 9) ---

    // Configuration
    var CONFIG = {
        slideInterval: {{ settings.slideshow_duration or 30 }} * 1000,
            weatherInterval: 600 * 1000, // 10 minutes
                alarmInterval: 10 * 1000     // 10 seconds
    };

    // Helper: XHR Request
    function fetchHTML(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    callback(xhr.responseText);
                } else {
                    console.error("Error fetching " + url);
                }
            }
        };
        xhr.send();
    }

    // Helper: POST Request (for Dismiss)
    function postAction(url, targetId) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                // Returns updated content
                var html = xhr.responseText;
                document.getElementById(targetId).innerHTML = html;
                lastAlarmHtml = html.trim(); // Update tracker
                bindDismissButtons(); // Re-bind after update
                try { formatAlarmTimesLegacy(); } catch (e) { console.error(e); }
            }
        };
        xhr.send();
    }

    // --- Components ---

    var lastAlarmHtml = "";
    function bindDismissButtons() {
        var wrapper = document.getElementById('alarm-wrapper');
        if (!wrapper) return;

        var buttons = wrapper.querySelectorAll('.dismiss-btn-small');
        for (var i = 0; i < buttons.length; i++) {
            var btn = buttons[i];
            var postUrl = btn.getAttribute('hx-post');
            if (postUrl) {
                btn.removeAttribute('hx-post'); // Prevent confusion
                // Create a closure for the URL
                (function (url) {
                    btn.onclick = function () {
                        postAction(url, 'alarm-wrapper');
                    };
                })(postUrl);
            }
        }
    }

    // Format alarm datetimes inserted into legacy alarm wrapper
    function formatAlarmTimesLegacy() {
        var wrapper = document.getElementById('alarm-wrapper');
        if (!wrapper) return;
        var els = wrapper.querySelectorAll('.alarm-time[data-start]');
        var now = new Date();
        for (var i = 0; i < els.length; i++) {
            var el = els[i];
            var startIso = el.getAttribute('data-start');
            var endIso = el.getAttribute('data-end');
            var allDay = el.getAttribute('data-allday') === 'true';
            if (!startIso) continue;
            try {
                var start = new Date(startIso);
                var end = endIso ? new Date(endIso) : null;
                var text = '';
                // Always show day information (Aujourd'hui/Demain or Weekday, D Month YYYY)
                var dayText = '';
                var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                var startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                var diffDays = Math.round((startDay - today) / 86400000);
                if (diffDays === 0) {
                    dayText = "Aujourd'hui";
                } else if (diffDays === 1) {
                    dayText = "Demain";
                } else {
                    var days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
                    var months = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
                    var month = months[start.getMonth()];
                    var dayNum = start.getDate();
                    var yearPart = start.getFullYear() === now.getFullYear() ? '' : ' ' + start.getFullYear();
                    dayText = days[start.getDay()] + ", " + dayNum + " " + month + yearPart;
                }

                if (allDay) {
                    text = dayText;
                } else {
                    var pad = function (n) { return n < 10 ? '0' + n : n; };
                    var t1 = pad(start.getHours()) + ':' + pad(start.getMinutes());
                    var t2 = end ? pad(end.getHours()) + ':' + pad(end.getMinutes()) : '';
                    var timeText = t1 + (t2 && t2 !== t1 ? '–' + t2 : '');
                    text = dayText + ' ' + timeText;
                }
                el.innerText = text;
            } catch (e) {
                el.innerText = startIso;
            }
        }
    }

    function updateWeather() {
        fetchHTML('/components/weather', function (html) {
            document.getElementById('weather-wrapper').innerHTML = html;
        });
    }

    function updateSlide() {
        fetchHTML('/components/slide?mode=legacy', function (html) {
            var wrapper = document.getElementById('slide-wrapper');
            var slideContainer = wrapper.querySelector('.slide-container');

            // Extract image URL from HTML to preload
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            var imgElement = tempDiv.querySelector('img');
            var imgUrl = imgElement ? imgElement.src : null;

            // Preload the image before transition
            if (imgUrl) {
                var preloadImg = new Image();
                preloadImg.onload = function () {
                    // Image is loaded, now do the transition
                    if (slideContainer) {
                        slideContainer.classList.add('fade-out');
                        setTimeout(function () {
                            wrapper.innerHTML = html;
                            var newSlide = wrapper.querySelector('.slide-container');
                            if (newSlide) {
                                // Add fade-out class first (opacity: 0)
                                newSlide.classList.add('fade-out');
                                // Trigger reflow to ensure transition applies
                                void newSlide.offsetHeight;
                                // Remove fade-out class to trigger fade-in (opacity: 1)
                                newSlide.classList.remove('fade-out');
                            }
                        }, 500);
                    } else {
                        wrapper.innerHTML = html;
                    }
                };
                preloadImg.src = imgUrl;
            } else {
                // No image found, just swap
                if (slideContainer) {
                    slideContainer.classList.add('fade-out');
                    setTimeout(function () {
                        wrapper.innerHTML = html;
                    }, 500);
                } else {
                    wrapper.innerHTML = html;
                }
            }
        });
    }

    function checkAlarm() {
        var tzOffset = (new Date()).getTimezoneOffset();
        fetchHTML('/components/alarm?tz_offset=' + tzOffset, function (html) {
            var wrapper = document.getElementById('alarm-wrapper');
            // Strip all whitespace and newlines for a robust comparison
            var normalize = function (s) {
                return s.replace(/\s/g, '').toLowerCase();
            };
            var normalizedHtml = normalize(html);
            // Only update if content changed significantly
            if (normalizedHtml !== lastAlarmHtml) {
                lastAlarmHtml = normalizedHtml;
                wrapper.innerHTML = html;
                bindDismissButtons(); // Bind listeners to new buttons
                try { formatAlarmTimesLegacy(); } catch (e) { console.error(e); }
            }
        });
    }

    // --- Clock ---
    function updateTime() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        if (minutes < 10) minutes = '0' + minutes;
        var timeStr = hours + ':' + minutes;

        var clockEl = document.getElementById('clock');
        if (clockEl) clockEl.innerText = timeStr;

        var months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        var days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
        var dateStr = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()];

        var dateEl = document.getElementById('date-display');
        if (dateEl) dateEl.innerText = dateStr;
    }

    // --- Initialization ---
    function init() {
        updateTime();
        updateWeather();
        updateSlide(); // Immediate load
        checkAlarm();

        setInterval(updateTime, 1000);
        setInterval(updateSlide, CONFIG.slideInterval);
        setInterval(updateWeather, CONFIG.weatherInterval);
        setInterval(checkAlarm, CONFIG.alarmInterval);
    }

    // Start
    init();
</script>

<script>
    (function () {
        function parseUtcStringToDate(utc) {
            if (!utc) return null;
            var s = String(utc).trim();
            if (s.indexOf('T') === -1 && s.indexOf(' ') !== -1) {
                s = s.replace(' ', 'T');
            }
            if (!(/[zZ]$/.test(s) || /[\+\-]\d{2}:?\d{2}$/.test(s))) {
                s = s + 'Z';
            }
            var d = new Date(s);
            if (isNaN(d.getTime())) return null;
            return d;
        }

        function formatLastSyncTime() {
            var el = document.getElementById('last-sync');
            if (!el) return;
            var utc = el.getAttribute('data-utc') || el.textContent || '';
            utc = (typeof utc === 'string') ? utc.trim() : '';
            if (!utc) return;
            try {
                var d = parseUtcStringToDate(utc);
                if (!d) {
                    var alt = utc.replace(' ', 'T') + 'Z';
                    d = parseUtcStringToDate(alt);
                }
                if (!d) return;
                el.textContent = 'Dernière synchronisation : ' + d.toLocaleString();
            } catch (e) {
                el.textContent = 'Dernière synchronisation : ' + utc;
            }
        }

        document.addEventListener('DOMContentLoaded', function () { try { formatLastSyncTime(); } catch (e) { } }, false);
    })();
</script>
{% endblock %}
