{% extends "base.html" %}

{% block head %}
<style>
    /* 
     * Legacy "Passive Display" Layout (iPad 2 / iOS 9)
     * No Flexbox centering in full-screen if problematic, no Backdrop Filter.
     */
    
    body {
        margin: 0; padding: 0;
        background: #000;
        font-family: Helvetica, Arial, sans-serif;
        overflow: hidden;
    }

    /* --- Layer 1: Slideshow --- */
    .slideshow-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: #000;
    }

    .slide-container {
        width: 100%;
        height: 100%;
    }

    .full-slide {
        width: 100%;
        height: 100%;
        /* object-fit: cover is supported in iOS 9.3+ but fallbacks are safer if needed */
        object-fit: cover;
        display: block;
    }

    /* --- Layer 2: Info Box --- */
    /* Center-Top Floating Box */
    .info-box-container {
        position: absolute;
        top: 20px;
        left: 50%;
        /* Translate trick works on iOS 9 */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 10;
        
        width: 450px;
        text-align: center;
        
        /* Fallback: Solid semi-transparent background (No blur) */
        background: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 20px;
        
        color: #fff;
    }

    #clock {
        font-size: 100px;
        font-weight: 100;
        margin-bottom: 10px;
        line-height: 1;
    }

    #date-display {
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
        color: #ddd;
    }

    /* Weather Component */
    .weather-info {
        border-top: 1px solid #555;
        padding-top: 12px;
        font-size: 24px;
        /* Using floats or inline-block for side-by-side if flex acts up, 
           but iOS 9 supports display:flex enough for simple rows */
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
    }
    
    .weather-info .temp { margin-right: 15px; font-weight: bold; }
    .weather-info .condition { opacity: 0.8; }

    /* --- Layer 3: Alarm Modal --- */
    .alarm-modal {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 100;
        background: rgba(0, 0, 0, 0.9);
        display: table; /* Old school vertical centering */
    }
    
    .alarm-content-wrapper {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
    }
    
    .alarm-content {
        display: inline-block;
        background: #fff;
        color: #000;
        padding: 40px;
        border-radius: 10px;
        max-width: 500px;
    }
    
    .alarm-content h1 { font-size: 40px; color: #cc0000; margin: 0 0 20px 0; }
    
    .dismiss-btn {
        font-size: 24px;
        padding: 15px 40px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 5px;
        margin-top: 20px;
        -webkit-appearance: none; /* iOS fix */
    }

    /* Simple Fade */
    .slide-container {
        -webkit-transition: opacity 1s;
        transition: opacity 1s;
    }
    
    .htmx-swapping > .slide-container {
        opacity: 0;
    }

    .admin-link {
        position: absolute;
        bottom: 15px;
        right: 15px;
        z-index: 50;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 16px;
        border: 1px solid #444;
    }
</style>
{% endblock %}

{% block content %}
<!-- Admin Access -->
<a href="/admin" class="admin-link">Admin</a>

<!-- Slideshow -->
<div id="slide-wrapper" class="slideshow-container">
     <div style="background: #222; width: 100%; height: 100%;"></div>
</div>

<!-- Info Box -->
<div class="info-box-container">
    <div id="clock">00:00</div>
    <div id="date-display">...</div>
    
    <div id="weather-wrapper">
         Loading Weather...
    </div>
</div>

<!-- Alarm Container -->
<div id="alarm-wrapper"></div>

<script>
    // --- legacy_engine.js (ES5 for iOS 9) ---

    // Configuration
    var CONFIG = {
        slideInterval: {{ settings.slideshow_duration or 30 }} * 1000,
        weatherInterval: 600 * 1000, // 10 minutes
        alarmInterval: 10 * 1000     // 10 seconds
    };

    // Helper: XHR Request
    function fetchHTML(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    callback(xhr.responseText);
                } else {
                    console.error("Error fetching " + url);
                }
            }
        };
        xhr.send();
    }
    
    // Helper: POST Request (for Dismiss)
    function postAction(url, targetId) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                // Usually returns empty string or new content
                document.getElementById(targetId).innerHTML = xhr.responseText;
            }
        };
        xhr.send();
    }

    // --- Components ---

    function updateWeather() {
        fetchHTML('/components/weather', function(html) {
            document.getElementById('weather-wrapper').innerHTML = html;
        });
    }

    function updateSlide() {
        fetchHTML('/components/slide?mode=legacy', function(html) {
            var wrapper = document.getElementById('slide-wrapper');
            // Simple cross-fade logic could go here, but direct swap is safer for performance on iPad 2
            wrapper.innerHTML = html;
        });
    }

    function checkAlarm() {
        fetchHTML('/components/alarm', function(html) {
            var wrapper = document.getElementById('alarm-wrapper');
            // Only update if content changed significantly or if we need to show/hide
            // For simplicity, just swap. If empty, it hides the modal.
            if (html.trim() !== wrapper.innerHTML.trim()) {
                 wrapper.innerHTML = html;
                 
                 // Re-attach dismiss listeners since we replaced HTML
                 // The dismiss button has an onclick in the HTML response? 
                 // No, the backend returns hx-post. We need to intercept that or change backend.
                 // FIX: We will parse the response and fix the button on the fly, 
                 // OR relies on the backend returning standard onclick.
                 // FOR NOW: Let's patch the DOM after insert.
                 
                 var btn = wrapper.querySelector('.dismiss-btn');
                 if (btn) {
                     var postUrl = btn.getAttribute('hx-post');
                     if (postUrl) {
                         btn.removeAttribute('hx-post'); // Prevent confusion
                         btn.onclick = function() {
                             postAction(postUrl, 'alarm-wrapper');
                         };
                     }
                 }
            }
        });
    }

    // --- Clock ---
    function updateTime() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        if (minutes < 10) minutes = '0' + minutes;
        var timeStr = hours + ':' + minutes;
        
        var clockEl = document.getElementById('clock');
        if (clockEl) clockEl.innerText = timeStr;
        
        var months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        var days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
        var dateStr = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()];
        
        var dateEl = document.getElementById('date-display');
        if (dateEl) dateEl.innerText = dateStr;
    }

    // --- Initialization ---
    function init() {
        updateTime();
        updateWeather();
        updateSlide(); // Immediate load
        checkAlarm();

        setInterval(updateTime, 1000);
        setInterval(updateSlide, CONFIG.slideInterval);
        setInterval(updateWeather, CONFIG.weatherInterval);
        setInterval(checkAlarm, CONFIG.alarmInterval);
    }

    // Start
    init();
</script>
{% endblock %}
