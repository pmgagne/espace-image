{% extends "base.html" %}

{% block head %}
<style>
    /*
     * Legacy "Passive Display" Layout (iPad 2 / iOS 9)
     * No Flexbox centering in full-screen if problematic, no Backdrop Filter.
     */

    body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: Helvetica, Arial, sans-serif;
        overflow: hidden;
    }



    /* --- Layer 1: Slideshow --- */
    .slideshow-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: #000;
    }

    /* Small timestamp used for alarm items */
    .alarm-time-small {
        font-size: 16px;
        color: #ccc;
        display: block;
        margin-top: 2px;
        font-weight: 400;
        letter-spacing: 0.5px;
    }

    .slide-container {
        width: 100%;
        height: 100%;
        opacity: 1;
        -webkit-transition: opacity 0.8s ease-in-out;
        transition: opacity 0.8s ease-in-out;
    }

    .slide-container.fade-out {
        opacity: 0;
    }

    .full-slide {
        width: 100%;
        height: 100%;
        /* object-fit: cover is supported in iOS 9.3+ but fallbacks are safer if needed */
        object-fit: cover;
        display: block;
    }

    /* --- Layer 2: Info Box --- */
    /* Center-Top Floating Box */
    .info-box-container {
        position: absolute;
        top: 20px;
        left: 50%;
        /* Translate trick works on iOS 9 */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 10;

        width: 450px;
        text-align: center;

        /* Fallback: Solid semi-transparent background (No blur) */
        background: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 20px;

        color: #fff;
    }

    #clock {
        font-size: 100px;
        font-weight: 100;
        margin-bottom: 10px;
        line-height: 1;
    }

    #date-display {
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
        color: #ddd;
    }

    /* Weather Component */
    .weather-info {
        border-top: 1px solid #555;
        padding-top: 12px;
        font-size: 24px;
        /* Using floats or inline-block for side-by-side if flex acts up,
           but iOS 9 supports display:flex enough for simple rows */
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
    }

    .weather-info .temp {
        margin-right: 15px;
        font-weight: bold;
    }

    .weather-info .condition {
        opacity: 0.8;
    }

    /* --- Layer 3: Persistent Alarm Box (Legacy) --- */
    .alarm-box-container {
        position: absolute;
        bottom: 60px;
        /* Above Admin link */
        left: 50%;
        /* iOS 9 supports transform */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 20;

        width: 450px;
        text-align: center;

        /* Solid background for legacy */
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 20px;
        border: 1px solid #555;

        color: #fff;
        box-sizing: border-box;
        /* Limit height and allow scrolling when multiple alarms appear */
        max-height: 40vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .alarm-item {
        padding-bottom: 15px;
        margin-bottom: 15px;
        border-bottom: 1px solid #555;
    }

    .alarm-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }

    .alarm-header {
        font-size: 24px;
        color: #fff;
        /* Brighter red for dark bg */
        font-weight: bold;
        margin-bottom: 5px;
    }

    .alarm-body {
        font-size: 18px;
        color: #fff;
        margin-bottom: 10px;
    }

    .dismiss-btn-small {
        background: #222;
        color: #aaa;
        border: 1px solid #555;
        padding: 8px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        -webkit-appearance: none;
        /* iOS Reset */
    }

    /* Simple Fade */
    .slide-container {
        -webkit-transition: opacity 1s;
        transition: opacity 1s;
    }

    .htmx-swapping>.slide-container {
        opacity: 0;
    }

    .admin-link {
        position: absolute;
        bottom: 15px;
        right: 15px;
        z-index: 50;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 16px;
        border: 1px solid #444;
    }
</style>

<link rel="manifest" href="/static/legacy-manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/espaceimage-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/espaceimage-512.png">
<link rel="icon" href="/static/espaceimage-512.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/espaceimage-192.png">
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/static/sw.js');
        });
    }
</script>

{% endblock %}

{% block content %}
<!-- Admin Access -->
<a href="/admin" class="admin-link">Admin</a>

<!-- Slideshow -->
<div id="slide-wrapper" class="slideshow-container">
    <div class="bg-dark w-full h-full"></div>
</div>

<!-- Info Box -->
<div class="info-box-container">
    <div id="clock">00:00</div>
    <div id="date-display">...</div>

    <div id="weather-wrapper">
        Loading Weather...
    </div>

    <div id="last-sync" data-utc="{{ last_sync_utc or '' }}">{{ last_sync_utc or '' }}</div>
</div>

<!-- Alarm Container -->
<div id="alarm-wrapper"></div>

<!-- Configuration (inline due to Jinja2 template variable) -->
<script>
    var CONFIG = {
        slideInterval: {{ settings.slideshow_duration or 30 }} * 1000,
            weatherInterval: 600 * 1000, // 10 minutes
                alarmInterval: 10 * 1000      // 10 seconds
    };
</script>

<!-- Legacy Slideshow Engine (ES5 for iOS 9.3) -->
<script src="{{ url_for('static', path='/js/legacy.js') }}"></script>

<script>
    (function () {
        function parseUtcStringToDate(utc) {
            if (!utc) return null;
            var s = String(utc).trim();
            if (s.indexOf('T') === -1 && s.indexOf(' ') !== -1) {
                s = s.replace(' ', 'T');
            }
            if (!(/[zZ]$/.test(s) || /[\+\-]\d{2}:?\d{2}$/.test(s))) {
                s = s + 'Z';
            }
            var d = new Date(s);
            if (isNaN(d.getTime())) return null;
            return d;
        }

        function formatLastSyncTime() {
            var el = document.getElementById('last-sync');
            if (!el) return;
            var utc = el.getAttribute('data-utc') || el.textContent || '';
            utc = (typeof utc === 'string') ? utc.trim() : '';
            if (!utc) return;
            try {
                var d = parseUtcStringToDate(utc);
                if (!d) {
                    var alt = utc.replace(' ', 'T') + 'Z';
                    d = parseUtcStringToDate(alt);
                }
                if (!d) return;
                el.textContent = 'Dernière synchronisation : ' + d.toLocaleString();
            } catch (e) {
                el.textContent = 'Dernière synchronisation : ' + utc;
            }
        }

        document.addEventListener('DOMContentLoaded', function () { try { formatLastSyncTime(); } catch (e) { } }, false);
    })();
</script>
{% endblock %}
