{% extends "base.html" %}

{% block head %}
<style>
    /*
     * Legacy "Passive Display" Layout (iPad 2 / iOS 9)
     * No Flexbox centering in full-screen if problematic, no Backdrop Filter.
     */

    body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: Helvetica, Arial, sans-serif;
        overflow: hidden;
    }

    /* --- Layer 1: Slideshow --- */
    .slideshow-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: #000;
    }

    .slide-container {
        width: 100%;
        height: 100%;
        opacity: 1;
        -webkit-transition: opacity 0.8s ease-in-out;
        transition: opacity 0.8s ease-in-out;
    }

    .slide-container.fade-out {
        opacity: 0;
    }

    .full-slide {
        width: 100%;
        height: 100%;
        /* object-fit: cover is supported in iOS 9.3+ but fallbacks are safer if needed */
        object-fit: cover;
        display: block;
    }

    /* --- Layer 2: Info Box --- */
    /* Center-Top Floating Box */
    .info-box-container {
        position: absolute;
        top: 20px;
        left: 50%;
        /* Translate trick works on iOS 9 */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 10;

        width: 450px;
        text-align: center;

        /* Fallback: Solid semi-transparent background (No blur) */
        background: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 20px;

        color: #fff;
    }

    #clock {
        font-size: 100px;
        font-weight: 100;
        margin-bottom: 10px;
        line-height: 1;
    }

    #date-display {
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
        color: #ddd;
    }

    /* Weather Component */
    .weather-info {
        border-top: 1px solid #555;
        padding-top: 12px;
        font-size: 24px;
        /* Using floats or inline-block for side-by-side if flex acts up,
           but iOS 9 supports display:flex enough for simple rows */
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
    }

    .weather-info .temp {
        margin-right: 15px;
        font-weight: bold;
    }

    .weather-info .condition {
        opacity: 0.8;
    }

    /* --- Layer 3: Persistent Alarm Box (Legacy) --- */
    .alarm-box-container {
        position: absolute;
        bottom: 60px;
        /* Above Admin link */
        left: 50%;
        /* iOS 9 supports transform */
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        z-index: 20;

        width: 450px;
        text-align: center;

        /* Solid background for legacy */
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 20px;
        border: 1px solid #555;

        color: #fff;
    }

    .alarm-item {
        padding-bottom: 15px;
        margin-bottom: 15px;
        border-bottom: 1px solid #555;
    }

    .alarm-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
    }

    .alarm-header {
        font-size: 24px;
        color: #ff5555;
        /* Brighter red for dark bg */
        font-weight: bold;
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .alarm-body {
        font-size: 18px;
        color: #ddd;
        margin-bottom: 10px;
    }

    .dismiss-btn-small {
        background: #222;
        color: #aaa;
        border: 1px solid #555;
        padding: 8px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        -webkit-appearance: none;
        /* iOS Reset */
    }

    /* Simple Fade */
    .slide-container {
        -webkit-transition: opacity 1s;
        transition: opacity 1s;
    }

    .htmx-swapping>.slide-container {
        opacity: 0;
    }

    .admin-link {
        position: absolute;
        bottom: 15px;
        right: 15px;
        z-index: 50;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 16px;
        border: 1px solid #444;
    }
</style>
{% endblock %}

{% block content %}
<!-- Admin Access -->
<a href="/admin" class="admin-link">Admin</a>

<!-- Slideshow -->
<div id="slide-wrapper" class="slideshow-container">
    <div style="background: #222; width: 100%; height: 100%;"></div>
</div>

<!-- Info Box -->
<div class="info-box-container">
    <div id="clock">00:00</div>
    <div id="date-display">...</div>

    <div id="weather-wrapper">
        Loading Weather...
    </div>
</div>

<!-- Alarm Container -->
<div id="alarm-wrapper"></div>

<script>
    // --- legacy_engine.js (ES5 for iOS 9) ---

    // Configuration
    var CONFIG = {
        slideInterval: {{ settings.slideshow_duration or 30 }} * 1000,
            weatherInterval: 600 * 1000, // 10 minutes
                alarmInterval: 10 * 1000     // 10 seconds
    };

    // Helper: XHR Request
    function fetchHTML(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    callback(xhr.responseText);
                } else {
                    console.error("Error fetching " + url);
                }
            }
        };
        xhr.send();
    }

    // Helper: POST Request (for Dismiss)
    function postAction(url, targetId) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                // Returns updated content
                var html = xhr.responseText;
                document.getElementById(targetId).innerHTML = html;
                lastAlarmHtml = html.trim(); // Update tracker
                bindDismissButtons(); // Re-bind after update
            }
        };
        xhr.send();
    }

    // --- Components ---

    var lastAlarmHtml = "";
    function bindDismissButtons() {
        var wrapper = document.getElementById('alarm-wrapper');
        if (!wrapper) return;

        var buttons = wrapper.querySelectorAll('.dismiss-btn-small');
        for (var i = 0; i < buttons.length; i++) {
            var btn = buttons[i];
            var postUrl = btn.getAttribute('hx-post');
            if (postUrl) {
                btn.removeAttribute('hx-post'); // Prevent confusion
                // Create a closure for the URL
                (function (url) {
                    btn.onclick = function () {
                        postAction(url, 'alarm-wrapper');
                    };
                })(postUrl);
            }
        }
    }

    function updateWeather() {
        fetchHTML('/components/weather', function (html) {
            document.getElementById('weather-wrapper').innerHTML = html;
        });
    }

    function updateSlide() {
        fetchHTML('/components/slide?mode=legacy', function (html) {
            var wrapper = document.getElementById('slide-wrapper');
            var slideContainer = wrapper.querySelector('.slide-container');

            // Extract image URL from HTML to preload
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            var imgElement = tempDiv.querySelector('img');
            var imgUrl = imgElement ? imgElement.src : null;

            // Preload the image before transition
            if (imgUrl) {
                var preloadImg = new Image();
                preloadImg.onload = function () {
                    // Image is loaded, now do the transition
                    if (slideContainer) {
                        slideContainer.classList.add('fade-out');
                        setTimeout(function () {
                            wrapper.innerHTML = html;
                            var newSlide = wrapper.querySelector('.slide-container');
                            if (newSlide) {
                                // Add fade-out class first (opacity: 0)
                                newSlide.classList.add('fade-out');
                                // Trigger reflow to ensure transition applies
                                void newSlide.offsetHeight;
                                // Remove fade-out class to trigger fade-in (opacity: 1)
                                newSlide.classList.remove('fade-out');
                            }
                        }, 500);
                    } else {
                        wrapper.innerHTML = html;
                    }
                };
                preloadImg.src = imgUrl;
            } else {
                // No image found, just swap
                if (slideContainer) {
                    slideContainer.classList.add('fade-out');
                    setTimeout(function () {
                        wrapper.innerHTML = html;
                    }, 500);
                } else {
                    wrapper.innerHTML = html;
                }
            }
        });
    }

    function checkAlarm() {
        var tzOffset = (new Date()).getTimezoneOffset();
        fetchHTML('/components/alarm?tz_offset=' + tzOffset, function (html) {
            var wrapper = document.getElementById('alarm-wrapper');
            // Strip all whitespace and newlines for a robust comparison
            var normalize = function (s) {
                return s.replace(/\s/g, '').toLowerCase();
            };
            var normalizedHtml = normalize(html);
            // Only update if content changed significantly
            if (normalizedHtml !== lastAlarmHtml) {
                lastAlarmHtml = normalizedHtml;
                wrapper.innerHTML = html;
                bindDismissButtons(); // Bind listeners to new buttons
            }
        });
    }

    // --- Clock ---
    function updateTime() {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes();
        if (minutes < 10) minutes = '0' + minutes;
        var timeStr = hours + ':' + minutes;

        var clockEl = document.getElementById('clock');
        if (clockEl) clockEl.innerText = timeStr;

        var months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        var days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
        var dateStr = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()];

        var dateEl = document.getElementById('date-display');
        if (dateEl) dateEl.innerText = dateStr;
    }

    // --- Initialization ---
    function init() {
        updateTime();
        updateWeather();
        updateSlide(); // Immediate load
        checkAlarm();

        setInterval(updateTime, 1000);
        setInterval(updateSlide, CONFIG.slideInterval);
        setInterval(updateWeather, CONFIG.weatherInterval);
        setInterval(checkAlarm, CONFIG.alarmInterval);
    }

    // Start
    init();
</script>
{% endblock %}
