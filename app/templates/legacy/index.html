{% extends "base.html" %}

{% block head %}
<style>
    /* Legacy Float-based Layout (No Grid) */
    .container {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    
    .slideshow-area {
        float: left;
        width: 70%; /* 70% width for slides */
        height: 100vh;
        background: #111;
        position: relative;
        text-align: center;
    }
    
    /* Centering in legacy is harder, using line-height hack or absolute centering */
    .slideshow-area img {
        max-width: 100%;
        max-height: 100%;
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        margin: auto;
    }
    
    .sidebar {
        float: right;
        width: 30%;
        height: 100vh;
        background: #222;
        padding: 10px;
        box-sizing: border-box; /* Crucial for padding math */
    }
    
    .clearfix::after {
        content: "";
        clear: both;
        display: table;
    }
    
    .weather-widget {
        border: 1px solid #444;
        padding: 10px;
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container clearfix">
    <!-- Slideshow Area -->
    <div class="slideshow-area"
         hx-get="/components/slide?mode=legacy"
         hx-trigger="load, every 30s"
         hx-swap="innerHTML">
         <p style="padding-top: 50%;">Loading...</p>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Legacy Mode</h3>
        
        <!-- Weather Widget -->
        <div hx-get="/components/weather" 
             hx-trigger="load, every 10m"
             hx-swap="innerHTML">
             Loading Weather...
        </div>
        
        <!-- Clock -->
        <div id="clock" style="font-size: 2em; margin-top: 20px;">00:00</div>
    </div>
</div>

<script>
    // Legacy compatible JS (var instead of const/let if strictly needed, but iOS 9 supports let)
    setInterval(function() {
        var now = new Date();
        var time = now.getHours() + ':' + (now.getMinutes()<10?'0':'') + now.getMinutes();
        document.getElementById('clock').innerText = time;
    }, 1000);
</script>
{% endblock %}
