{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="/static/css/admin-forms.css">
{% endblock %}

{% block content %}
<div style="padding: 20px; background: #222; min-height: 100vh; color: #fff;">
    <h1>Admin Panel</h1>
    <a href="/" style="color: #aaa;">Back to Slideshow</a>

    <hr>

    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
        <!-- Settings -->
        <div style="background: #333; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px;">
            <h2>Settings</h2>
            <form action="/admin/settings/active-preset" method="post">
                <label>Active Slideshow Preset:</label>
                <select name="preset_id">
                    {% for preset in presets %}
                    <option value="{{ preset.id }}" {% if settings.active_preset_id==preset.id %}selected{% endif %}>
                        {{ preset.name }} ({{ preset.photos|length }} photos)
                    </option>
                    {% endfor %}
                </select>
                <button type="submit">Save</button>
            </form>
        </div>

        <!-- Create Preset -->
        <div style="background: #333; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px;">
            <h2>New Preset</h2>
            <form action="/admin/presets" method="post">
                <input type="text" name="name" placeholder="Preset Name" required>
                <button type="submit">Create</button>
            </form>
        </div>
    </div>

    <hr>

    <!-- Upload -->
    <div style="background: #333; padding: 20px; border-radius: 8px;">
        <h2>Upload Photos</h2>
        <form action="/admin/upload" method="post" enctype="multipart/form-data">
            <label>Target Preset:</label>
            <select name="preset_id">
                {% for preset in presets %}
                <option value="{{ preset.id }}">{{ preset.name }}</option>
                {% endfor %}
            </select>
            <br><br>
            <label class="file-input-wrapper btn" data-placeholder="Choose Photos">
                <span class="btn-text">Choose Photos</span>
                <input type="file" name="files" multiple accept="image/*">
            </label>
            <br><br>
            <button type="submit">Upload</button>
        </form>
    </div>
</div>

<script>
    // Include file input logic for this page too
    document.body.addEventListener('change', function (e) {
        if (e.target && e.target.type === 'file') {
            var wrapper = e.target.parentNode;
            if (wrapper.classList.contains('file-input-wrapper')) {
                var labelSpan = wrapper.querySelector('.btn-text');
                if (labelSpan) {
                    var count = e.target.files ? e.target.files.length : 1;
                    if (count > 0) {
                        labelSpan.innerText = count + (count === 1 ? " File Selected" : " Files Selected");
                    } else {
                        labelSpan.innerText = wrapper.getAttribute('data-placeholder') || "Choose Files";
                    }
                }
            }
        }
    });
</script>
{% endblock %}
