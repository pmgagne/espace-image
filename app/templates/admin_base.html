<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Dashboard Admin</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #1a1a1a; color: #fff; height: 100vh; overflow: hidden; display: flex; }
        
        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .sidebar h1 { margin-top: 0; font-size: 1.2rem; color: #ddd; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-links { list-style: none; padding: 0; margin-top: 2rem; }
        .nav-links li { margin-bottom: 10px; }
        
        .nav-link {
            display: block;
            padding: 10px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }
        
        .nav-link:hover, .nav-link.active {
            background: #333;
            color: #fff;
        }
        
        .back-link { margin-top: auto; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #fff; }

        /* Content Area */
        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        
        /* Forms & Inputs */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button.delete-btn { background: #dc3545; }
        button.delete-btn:hover { background: #a71d2a; }
        
        label { display: block; margin-bottom: 5px; color: #ccc; }
        h2 { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* Grid for Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .photo-card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1;
        }
        
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-actions {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            text-align: right;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .photo-card:hover .photo-actions { opacity: 1; }
        
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1 }
        .htmx-request.htmx-indicator { opacity: 1 }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h1>Admin Panel</h1>
        
        <ul class="nav-links">
            <li>
                <a class="nav-link" 
                   hx-get="/admin/partials/settings" 
                   hx-target="#admin-content" 
                   hx-trigger="click, load">General Settings</a>
            </li>
            <li>
                <a class="nav-link" 
                   hx-get="/admin/partials/calendars" 
                   hx-target="#admin-content">Calendars</a>
            </li>
            <li>
                <a class="nav-link" 
                   hx-get="/admin/partials/gallery" 
                   hx-target="#admin-content">Gallery</a>
            </li>
        </ul>
        
        <a href="/" class="back-link">← Back to Dashboard</a>
    </nav>

    <main class="content" id="admin-content">
        <!-- Content loaded via HTMX -->
        <div class="htmx-indicator">Loading...</div>
    </main>

    <script>
        // Simple script to toggle active class on sidebar
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            const path = evt.detail.requestConfig.path;
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('hx-get') === path) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
