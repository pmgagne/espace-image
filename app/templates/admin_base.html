<!DOCTYPE html>
<html lang="en">
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var log = document.getElementById('debug-log');
            if (log) {
                var item = document.createElement('div');
                item.style.borderBottom = "1px solid #444";
                item.style.padding = "4px";
                item.innerText = "ERR: " + msg + "\n" + url + ":" + line;
                log.appendChild(item);
            }
            return false;
        };
        
        // Capture console.log too
        var oldLog = console.log;
        console.log = function(msg) {
            oldLog.apply(console, arguments);
            var log = document.getElementById('debug-log');
            if (log) {
                var item = document.createElement('div');
                item.innerText = "LOG: " + msg;
                item.style.color = "#aaa";
                log.appendChild(item);
            }
        };

        // Redirect HTMX logs
        function htmxLogger(elt, event, data) {
            if(console.log) console.log("HTMX: " + event);
        }
    </script>
    
    <!-- Polyfills for Legacy Browsers (iPad 2 / iOS 9) -->
    <script src="/static/polyfills/promise.min.js"></script>
    <script src="/static/polyfills/fetch.umd.js"></script>
    
    <!-- HTMX -->
    <script src="/static/js/htmx.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #1a1a1a; color: #fff; height: 100vh; overflow: hidden; display: flex; }
        
        /* Debug Log */
        #debug-log {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 150px;
            background: rgba(0,0,0,0.9);
            color: #ff5555;
            font-family: monospace;
            font-size: 10px;
            overflow-y: scroll;
            z-index: 9999;
            border-top: 2px solid #555;
            padding: 5px;
            pointer-events: none; /* Let clicks pass through if needed, but scrolling needs events... actually let's keep it interactive */
            pointer-events: auto;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 160px; /* Space for debug log */
        }
        
        .sidebar h1 { margin-top: 0; font-size: 1.2rem; color: #ddd; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-links { list-style: none; padding: 0; margin-top: 2rem; }
        .nav-links li { margin-bottom: 10px; }
        
        .nav-link {
            display: block;
            padding: 10px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }
        
        .nav-link:hover, .nav-link.active {
            background: #333;
            color: #fff;
        }
        
        .back-link { margin-top: auto; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #fff; }

        /* Content Area */
        .content {
            flex: 1;
            padding: 40px;
            padding-bottom: 160px; /* Space for debug log */
            overflow-y: auto;
        }
        
        /* Forms & Inputs */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button.delete-btn { background: #dc3545; }
        button.delete-btn:hover { background: #a71d2a; }
        
        label { display: block; margin-bottom: 5px; color: #ccc; }
        h2 { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* Grid for Gallery (Flex fallback) */
        .gallery-grid {
            display: -webkit-flex;
            display: flex;
            flex-wrap: wrap;
            margin-top: 20px;
            margin-left: -10px; margin-right: -10px;
        }
        
        .photo-card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            /* Flex column width approx 150px */
            width: 150px;
            height: 150px;
            margin: 10px;
        }
        
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .photo-actions {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            text-align: right;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .photo-card:hover .photo-actions { opacity: 1; }
        
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1 }
        .htmx-request.htmx-indicator { opacity: 1 }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h1>Admin Panel</h1>
        
        <ul class="nav-links">
            <li>
                <a class="nav-link" id="link-settings"
                   hx-get="/admin/partials/settings" 
                   hx-target="#admin-content" 
                   hx-trigger="click">General Settings</a>
            </li>
            <li>
                <a class="nav-link" 
                   hx-get="/admin/partials/calendars" 
                   hx-target="#admin-content">Calendars</a>
            </li>
            <li>
                <a class="nav-link" 
                   hx-get="/admin/partials/gallery" 
                   hx-target="#admin-content">Gallery</a>
            </li>
        </ul>
        
        <a href="/" class="back-link">← Back to Dashboard</a>
    </nav>

    <main class="content" id="admin-content">
        <!-- Content loaded via HTMX -->
        <div class="htmx-indicator">Loading...</div>
    </main>

    <!-- Debug Log -->
    <div id="debug-log">
        <div>Console Ready...</div>
    </div>

    <script>
        // Check environment
        if (window.htmx) {
            console.log("HTMX Loaded: " + window.htmx.version);
            htmx.logger = htmxLogger;
        } else {
            console.log("ERR: window.htmx is undefined!");
        }

        try {
            var ev = new CustomEvent("test");
            console.log("CustomEvent OK");
        } catch(e) {
            console.log("ERR: CustomEvent failed: " + e.message);
        }

        // Simple script to toggle active class on sidebar (ES5)
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            var path = evt.detail.requestConfig.path;
            var links = document.querySelectorAll('.nav-link');
            for (var i = 0; i < links.length; i++) {
                var link = links[i];
                link.classList.remove('active');
                if (link.getAttribute('hx-get') === path) {
                    link.classList.add('active');
                }
            }
        });

        // Auto-load first tab safely
        setTimeout(function() {
            console.log("Triggering initial load...");
            var el = document.getElementById('link-settings');
            if (el) el.click();
        }, 1000);
    </script>
</body>
</html>
