<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace-Image Admin</title>

    <!-- Polyfills for Legacy Browsers (iPad 2 / iOS 9) -->
    <script src="/static/polyfills/promise.min.js"></script>
    <script src="/static/polyfills/fetch.umd.js"></script>

    <!-- HTMX (Pure ES5 Version 1.0.0 for iPad 2) -->
    <script src="/static/js/htmx.min.js"></script>

    <!-- Shared Admin Form Styles -->
    <link rel="stylesheet" href="/static/css/admin-forms.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Gallery / Admin helper classes (used by gallery partial) */
        .top-bar {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 20px;
            background: #222;
            padding: 20px;
            border-radius: 8px;
        }

        .preset-select {
            flex: 1;
        }

        .preset-create {
            border-left: 1px solid #444;
            padding-left: 20px;
        }

        .preset-select,
        .preset-create {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .preset-create-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Ensure all direct children center within the form row */
        .preset-create-form>* {
            align-self: center;
        }

        .preset-create-form input[type="text"] {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 1rem;
            min-width: 200px;
        }

        .preset-select select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 1rem;
            min-width: 200px;
        }

        .preset-create label,
        .preset-select label {
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .preset-create-form input[type="text"],
        .preset-select select,
        .preset-create-form button {
            box-sizing: border-box;
        }

        .preset-create-form button {
            padding: 8px 12px;
            border-radius: 6px;
            background: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        /* Force identical visual height and centering */
        .preset-create-form input[type="text"],
        .preset-create-form button {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: 1rem;
            line-height: normal;
        }

        .preset-create-form input[type="text"] {
            padding-top: 0;
            padding-bottom: 0;
            padding-left: 12px;
            padding-right: 12px;
            border: 1px solid #444;
        }

        .preset-create-form button {
            padding-left: 12px;
            padding-right: 12px;
            border: 1px solid #007bff;
            background: #007bff;
            box-shadow: none;
            vertical-align: middle;
            /* Nudge up slightly to match input visual baseline */
            transform: translateY(-1px);
            -webkit-appearance: none;
            appearance: none;
            line-height: 1;
            margin: 0;
        }

        .preset-create-form input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
            line-height: 1;
            margin: 0;
        }

        /* Remove extra inner padding added by some browsers for buttons */
        .preset-create-form button::-webkit-focus-inner {
            border: 0;
            padding: 0;
        }

        .preset-create-form button::-moz-focus-inner {
            border: 0;
            padding: 0;
        }

        .upload-area {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-message {
            background: #3a1f1f;
            color: #ffdede;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #007bff;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        .file-input-wrapper input[type=file] {
            display: inline-block;
            margin-left: 8px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .photo-card {
            background: #111;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .photo-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .photo-actions {
            margin-top: 8px;
        }

        .delete-btn {
            padding: 5px 10px;
            font-size: 0.8em;
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h1 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #ddd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin-top: 2rem;
        }

        .nav-links li {
            margin-bottom: 10px;
        }

        .nav-link {
            display: block;
            padding: 10px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #333;
            color: #fff;
        }

        .back-link {
            margin-top: auto;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
    </style>
    <link rel="manifest" href="/static/admin-manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/espaceimage-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/espaceimage-512.png">
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="/static/espaceimage-512.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/espaceimage-192.png">
</head>

<body>

    <nav class="sidebar">
        <h1>Admin Panel</h1>

        <ul class="nav-links">
            <li>
                <a class="nav-link" id="link-settings" hx-get="/admin/partials/settings" hx-target="#admin-content"
                    hx-trigger="click">General Settings</a>
            </li>
            <li>
                <a class="nav-link" hx-get="/admin/partials/calendars" hx-target="#admin-content">Calendars</a>
            </li>
            <li>
                <a class="nav-link" hx-get="/admin/partials/gallery" hx-target="#admin-content">Gallery</a>
            </li>
            {% if debug_mode %}
            <li>
                <a class="nav-link" hx-get="/admin/partials/debug" hx-target="#admin-content">Debug</a>
            </li>
            {% endif %}
        </ul>

        <a href="/" class="back-link">← Back to Slideshow</a>
    </nav>

    <main class="content" id="admin-content">
        <!-- Content loaded via HTMX -->
        <div class="htmx-indicator">Loading...</div>
    </main>

    <script>
        // Simple script to toggle active class on sidebar (ES5)
        document.body.addEventListener('htmx:afterOnLoad', function (evt) {
            var path = evt.detail.requestConfig.path;
            var links = document.querySelectorAll('.nav-link');
            for (var i = 0; i < links.length; i++) {
                var link = links[i];
                link.classList.remove('active');
                if (link.getAttribute('hx-get') === path) {
                    link.classList.add('active');
                }
            }
        });

        // Auto-load first tab safely (iPad 2 needs a delay)
        setTimeout(function () {
            var el = document.getElementById('link-settings');
            if (el) el.click();
        }, 800);

        // File Input Label Update
        document.body.addEventListener('change', function (e) {
            if (e.target && e.target.type === 'file') {
                // Find closest label or wrapper text
                var wrapper = e.target.parentNode;
                if (wrapper.classList.contains('file-input-wrapper')) {
                    var labelSpan = wrapper.querySelector('.btn-text');
                    if (labelSpan) {
                        var count = e.target.files ? e.target.files.length : 1;
                        if (count > 0) {
                            labelSpan.innerText = count + (count === 1 ? " File Selected" : " Files Selected");
                        } else {
                            labelSpan.innerText = wrapper.getAttribute('data-placeholder') || "Choose Files";
                        }
                    }
                }
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/static/sw.js').catch(function (err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
    <script src="/static/js/admin.js?v={{ static_asset_version }}"></script>
</body>

</html>
