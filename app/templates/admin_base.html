<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace-Image Admin</title>

    <!-- Polyfills for Legacy Browsers (iPad 2 / iOS 9) -->
    <script src="/static/polyfills/promise.min.js"></script>
    <script src="/static/polyfills/fetch.umd.js"></script>

    <!-- HTMX (Pure ES5 Version 1.0.0 for iPad 2) -->
    <script src="/static/js/htmx.min.js"></script>

    <!-- Shared Admin Form Styles -->
    <link rel="stylesheet" href="/static/css/admin-forms.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar h1 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #ddd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin-top: 2rem;
        }

        .nav-links li {
            margin-bottom: 10px;
        }

        .nav-link {
            display: block;
            padding: 10px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #333;
            color: #fff;
        }

        .back-link {
            margin-top: auto;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
    </style>
    <link rel="manifest" href="/static/admin-manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/espaceimage-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/espaceimage-512.png">
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="/static/espaceimage-512.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/espaceimage-192.png">
</head>

<body>

    <nav class="sidebar">
        <h1>Admin Panel</h1>

        <ul class="nav-links">
            <li>
                <a class="nav-link" id="link-settings" hx-get="/admin/partials/settings" hx-target="#admin-content"
                    hx-trigger="click">General Settings</a>
            </li>
            <li>
                <a class="nav-link" hx-get="/admin/partials/calendars" hx-target="#admin-content">Calendars</a>
            </li>
            <li>
                <a class="nav-link" hx-get="/admin/partials/gallery" hx-target="#admin-content">Gallery</a>
            </li>
            {% if debug_mode %}
            <li>
                <a class="nav-link" hx-get="/admin/partials/debug" hx-target="#admin-content">Debug</a>
            </li>
            {% endif %}
        </ul>

        <a href="/" class="back-link">← Back to Slideshow</a>
    </nav>

    <main class="content" id="admin-content">
        <!-- Content loaded via HTMX -->
        <div class="htmx-indicator">Loading...</div>
    </main>

    <script>
        // Simple script to toggle active class on sidebar (ES5)
        document.body.addEventListener('htmx:afterOnLoad', function (evt) {
            var path = evt.detail.requestConfig.path;
            var links = document.querySelectorAll('.nav-link');
            for (var i = 0; i < links.length; i++) {
                var link = links[i];
                link.classList.remove('active');
                if (link.getAttribute('hx-get') === path) {
                    link.classList.add('active');
                }
            }
        });

        // Auto-load first tab safely (iPad 2 needs a delay)
        setTimeout(function () {
            var el = document.getElementById('link-settings');
            if (el) el.click();
        }, 800);

        // File Input Label Update
        document.body.addEventListener('change', function (e) {
            if (e.target && e.target.type === 'file') {
                // Find closest label or wrapper text
                var wrapper = e.target.parentNode;
                if (wrapper.classList.contains('file-input-wrapper')) {
                    var labelSpan = wrapper.querySelector('.btn-text');
                    if (labelSpan) {
                        var count = e.target.files ? e.target.files.length : 1;
                        if (count > 0) {
                            labelSpan.innerText = count + (count === 1 ? " File Selected" : " Files Selected");
                        } else {
                            labelSpan.innerText = wrapper.getAttribute('data-placeholder') || "Choose Files";
                        }
                    }
                }
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/static/sw.js').catch(function (err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>

</html>
