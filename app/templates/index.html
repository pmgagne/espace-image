{% extends "base.html" %}

{% block head %}
<style>
    /*
     * Modern "Passive Display" Layout
     * Stack: Fullscreen Slideshow (z=0) < Info Box (z=10) < Alarm Modal (z=100)
     */

    body {
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }



    /* --- Layer 1: Slideshow --- */
    .slideshow-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        background: #000;
        overflow: hidden;
    }

    .slide-container {
        width: 100%;
        height: 100%;
        animation: fadeIn 1s ease-in-out;
    }

    .full-slide {
        width: 100%;
        height: 100%;
        /* Fill screen, crop if needed */
        display: block;
    }

    .slide-placeholder {
        width: 100%;
        height: 100%;
        background: #111;
        display: block;
    }

    /* single fadeIn keyframes above used for slideshow animations */

    @keyframes fadeOut {
        from {
            opacity: 1;
        }

        to {
            opacity: 0;
        }
    }

    /* Cross-dissolve: fade out before swap, fade in after */
    .htmx-swapping .slide-container {
        animation: fadeOut 1s ease-in-out forwards;
    }

    .htmx-added.slide-container {
        animation: fadeIn 1s ease-in-out;
    }

    /* --- Layer 2: Floating Info Box --- */
    .info-box-container {
        position: fixed;
        top: 3vh;
        /* Slight gap from top */
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

        background: rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(15px);
        backdrop-filter: blur(15px);

        padding: 1.5rem 3rem;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);

        color: #fff;
        min-width: 300px;
    }

    /* Small timestamp used for alarm items */
    .alarm-time-small {
        font-size: 1rem;
        color: #ccc;
        display: block;
        margin-top: 2px;
        font-weight: 400;
        letter-spacing: 0.5px;
    }

    /* --- Layer 3: Persistent Alarm Box (Bottom Center) --- */
    .alarm-box-container {
        position: fixed;
        bottom: 5vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        /* Above info box if overlap, but mainly above slides */

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

        background: rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(15px);
        backdrop-filter: blur(15px);

        padding: 1.5rem;
        border-radius: 20px;
        border: 1px solid rgba(255, 50, 50, 0.3);
        /* Red tint border */
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);

        color: #fff;
        min-width: 350px;
        max-width: 80vw;
        max-height: 40vh;
        overflow-y: auto;
    }

    .alarm-box-container.animate-in {
        animation: slideUp 0.5s ease-out;
    }

    .alarm-item {
        width: 100%;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .alarm-item>*+* {
        margin-top: 5px;
    }

    .alarm-item:last-child {
        border-bottom: none;
    }

    .alarm-header {
        display: flex;
        align-items: center;
        color: #fff;
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: 1px;
    }

    .alarm-header>*+* {
        margin-left: 10px;
    }

    .alarm-body {
        font-size: 1.2rem;
        color: #fff;
        opacity: 0.9;
        margin-bottom: 10px;
    }

    .dismiss-btn-small {
        background: transparent;
        color: #aaa;
        border: 1px solid #555;
        padding: 5px 15px;
        font-size: 0.9rem;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .dismiss-btn-small:hover {
        background: #fff;
        color: #000;
        border-color: #fff;
    }

    #clock {
        font-size: 8rem;
        font-weight: 200;
        /* Thin font */
        line-height: 1;
        letter-spacing: -2px;
        margin-bottom: 0.5rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    #date-display {
        font-size: 2rem;
        font-weight: 400;
        opacity: 0.9;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    /* Weather Component Styling (injected via HTMX) */
    .weather-info {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        font-weight: 300;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 1rem;
        width: 100%;
    }

    .weather-info .temp {
        font-weight: 500;
    }

    .weather-info .condition {
        margin-left: 20px;
        opacity: 0.8;
        font-size: 1.2rem;
    }

    /* Animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes slideUp {
        from {
            transform: translate(-50%, 100%);
            opacity: 0;
        }

        to {
            transform: translate(-50%, 0);
            opacity: 1;
        }
    }

    /* HTMX Transition Support */
    .htmx-swapping>.slide-container {
        opacity: 0;
        transition: opacity 1s ease-out;
    }

    .admin-link {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 50;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.3);
        padding: 8px 12px;
        border-radius: 50%;
        text-decoration: none;
        font-size: 1.2rem;
        line-height: 1;
        transition: all 0.3s;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .admin-link:hover {
        color: rgba(255, 255, 255, 1);
        background: rgba(0, 0, 0, 0.6);
    }

    .today-events-wrapper {
        position: fixed;
        left: 20px;
        bottom: 20px;
        z-index: 30;
        max-width: min(420px, 80vw);
    }

    .today-events-toggle {
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 8px 12px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.3rem;
        line-height: 1;
    }

    .today-events-panel {
        margin-top: 8px;
        background: rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        padding: 12px;
        color: #fff;
    }

    .today-events-title {
        font-weight: 600;
        margin-bottom: 8px;
    }

    .today-events-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 34vh;
        overflow-y: auto;
    }

    .today-event-item {
        display: flex;
        flex-direction: column;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .today-event-item:last-child {
        border-bottom: none;
    }

    .today-event-title {
        font-weight: 500;
    }

    .today-event-time,
    .today-events-empty {
        color: #d1d5db;
        font-size: 0.9rem;
    }

    .today-event-time {
        margin-top: 2px;
    }

    .d-none {
        display: none !important;
    }
</style>

<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/espaceimage-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/espaceimage-512.png">
<link rel="icon" href="/static/espaceimage-512.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/espaceimage-192.png">
<script>
    window.ESPACE_CONFIG = {
        dayFetchIntervalMs: {{ frontend_day_fetch_interval_ms }}
    };
</script>
<script src="/static/js/main.js"></script>

{% endblock %}

{% block content %}
<!-- Admin Access -->
<a href="/admin" class="admin-link" aria-label="Admin">⚙</a>

<!-- Slideshow Background -->
<div class="slideshow-container" hx-get="/components/slide?mode=modern"
    hx-trigger="load, every {{ settings.slideshow_duration or 30 }}s" hx-swap="innerHTML swap:1s">
    <!-- Placeholder -->
    <div class="slide-placeholder" aria-hidden="true"></div>
</div>

<!-- Top Center Info Box -->
<div class="info-box-container">
    <div id="clock">00:00</div>
    <div id="date-display">Monday, January 1</div>

    <!-- Weather Widget (initial load only - refreshed by index refresh OOB) -->
    <div id="weather-wrapper" hx-get="/components/weather" hx-trigger="load" hx-swap="innerHTML">
        <div class="weather-info">Loading...</div>
    </div>
</div>

<!-- Alarm Poller (initial load only - refreshed by index refresh) -->
<div id="alarm-poller" hx-get="/components/alarm" hx-trigger="load" hx-swap="innerHTML">
</div>

<div id="today-events-wrapper" class="today-events-wrapper d-none">
    <button type="button" id="today-events-toggle" class="today-events-toggle"
        aria-label="Show Today's Events">📅</button>
    <div id="today-events-panel" class="today-events-panel d-none">
        <div class="today-events-title">Today's Events (<span id="today-events-count">0</span>)</div>
        <ul id="today-events-list" class="today-events-list">
            <li class="today-events-empty">No events today.</li>
        </ul>
    </div>
</div>

<!-- Central index refresh: initial load via HTMX; subsequent refreshes driven by JS using /api/v1/config/refresh-hints -->
<div id="index-refresh" hx-get="/components/index-refresh" hx-trigger="load" hx-swap="none"></div>

{% endblock %}
